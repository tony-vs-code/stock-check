services:
  ubstock:
    build: .
    container_name: ubstock
    ports:
      - "8000:8000"
    volumes:
      - ./data:/usr/src/app/data
      - ./logs:/usr/src/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
