[project]
name = "ubstock"
version = "0.4.0"
description = "UB Stock Monitor with modern Web UI, SQLite persistence, and optional Discord alerting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohappyeyeballs==2.4.0",
    "aiohttp==3.10.6",
    "aiosignal==1.3.1",
    "attrs==24.2.0",
    "beautifulsoup4==4.12.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "discord-py==2.4.0",
    "fastapi>=0.110.0",
    "frozenlist==1.4.1",
    "idna==3.10",
    "multidict==6.1.0",
    "pydantic>=2.0.0",
    "python-decouple==3.8",
    "requests==2.28.2",
    "soupsieve==2.6",
    "urllib3==1.26.20",
    "uvicorn[standard]>=0.28.0",
    "yarl==1.12.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.7",
]

[tool.ruff]
# Set the maximum line length to 88.
line-length = 88

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]

[tool.ruff.format]
# Enable Ruff's formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"